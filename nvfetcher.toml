[cmux]
src.github = "manaflow-ai/cmux"
src.prefix = "v"
fetch.url = "https://github.com/manaflow-ai/cmux/releases/download/v$ver/cmux-macos.dmg"

# Logseq desktop app (the 2.x "DB version") macOS arm64 .dmg. nixpkgs carries
# only 0.10.15 (the legacy file-based version), so 2.x is repackaged here.
#
# `src.github_tag` (max tag), NOT `src.github` (latest release): the tag source
# is the only one that accepts nvchecker's list options, and we need
# `include_regex` to keep the updater on STABLE releases. Logseq's tag namespace
# is noisy — it carries `nightly`, `daily`, `mobile-0.1.1`, `v0.0.1`,
# `github-action-repro`, `backup/…` and prerelease tags like `0.10.11-rc1`.
# `include_regex` is whole-string (nvchecker semantics), so a bare X.Y.Z pattern
# accepts 2.0.1 / a future 2.1.1 / 2.2.0 and rejects every one of those — the
# `-rc1` suffix alone breaks the match. Verified against the live tag list:
# with this regex nvchecker resolves 2.0.1, and a probe restricted to
# `0\.10\.11` returns `0.10.11` while `0.10.11-rc1` is visible but filtered out.
# No `src.prefix`: logseq's release tags are bare (`2.0.1`, not `v2.0.1`).
#
# The artifact name is capital-L `Logseq-…` — the canonical asset name. GitHub
# happens to redirect the lowercase spelling too, but `verify-provenance.sh`
# matches the basename against upstream's SHA256SUMS.txt, which lists the
# capitalized name, so this MUST stay capitalized.
[logseq]
src.github_tag = "logseq/logseq"
src.include_regex = '[0-9]+\.[0-9]+\.[0-9]+'
fetch.url = "https://github.com/logseq/logseq/releases/download/$ver/Logseq-darwin-arm64-$ver.dmg"

# Eclipse EPP "Eclipse IDE for Java Developers" macOS .dmg. Pinned to a fixed
# quarterly release with nvchecker's `manual` source (`src.manual`), so the
# nightly updater never auto-bumps it — Eclipse releases are quarterly and each
# bump is a deliberate, reviewed change. The download URL is a static literal
# (the path embeds the release train `2026-06/R`, which does not map cleanly to
# a `$ver` substitution). aarch64-darwin only.
[eclipse-java]
src.manual = "2026-06-R"
fetch.url = "https://download.eclipse.org/technology/epp/downloads/release/2026-06/R/eclipse-java-2026-06-R-macosx-cocoa-aarch64.dmg"

# Project Lombok's javaagent jar, baked into the composed Eclipse so JDT's ECJ
# compiler recognizes Lombok annotations (see packages/eclipse-with-gradleimport).
# VERSION DISCOVERY via Maven Central's maven-metadata.xml, ARTIFACT via the same
# host (the cmux "discover-then-override" model: src.* discovers, fetch.url is the
# real download).
#
# NOT the cmux `src.github` model: lombok publishes NO GitHub "releases"
# (api.github.com/.../releases/latest -> 404), so nvfetcher's github source (which
# is CheckGitHubRelease) errors out. It only tags even/stable patches on GitHub
# (v1.18.46, v1.18.44, ...); odd numbers (1.18.47) are edge/dev builds absent from
# both GitHub tags and Maven Central. Rather than depend on GitHub tags at all, we
# discover against `<release>` in Maven Central's maven-metadata.xml — the
# canonical "latest STABLE release available on Maven Central" field — via an
# nvchecker `regex` (webpage) source. `$ver` is then the bare `1.18.46` (no `v` to
# strip), which drops straight into the Maven Central jar path. This guarantees we
# never pin a version whose jar 404s and never pick up an odd edge build.
[lombok]
src.webpage = "https://repo1.maven.org/maven2/org/projectlombok/lombok/maven-metadata.xml"
src.regex = "<release>([^<]+)</release>"
fetch.url = "https://repo1.maven.org/maven2/org/projectlombok/lombok/$ver/lombok-$ver.jar"

# NOTE: no `src.prefix = "v"`. nvfetcher's `fetch.github` fetches rev `$ver`
# verbatim, and pint's release tags are `vX.Y.Z`; stripping the prefix would
# make it fetch rev `0.87.0` (no such tag -> 404). Keeping the `v` in the
# version yields the correct `fetchFromGitHub` rev; packages/pint strips it
# for the ldflag.
[pint]
src.github = "cloudflare/pint"
fetch.github = "cloudflare/pint"

# Same pattern as pint: glowm's release tags are `vX.Y.Z`; keep the `v`
# (no `src.prefix`) so `fetch.github` fetches the correct rev, and let
# packages/glowm strip it for the version/ldflag.
[glowm]
src.github = "atani/glowm"
fetch.github = "atani/glowm"

# github/gh-stack is a private-preview `gh` extension; pin the release tag
# manually (like eclipse-java/cmux above) so the nightly updater never
# auto-bumps it to an unreviewed preview release, and let fetch.github fetch
# that exact tag.
[gh-stack]
src.manual = "v0.0.8"
fetch.github = "github/gh-stack"

# gomu -- Go mutation testing engine, wrapped by pg-go-mutate in nix-repo-base.
# fetch.github takes rev $ver verbatim, so the leading "v" is kept (see [pint]).
[gomu]
src.github = "sivchari/gomu"
fetch.github = "sivchari/gomu"

# CleverCloud/mdr -- Rust Markdown/Mermaid viewer. Tracked as `mdr-rs`, NOT
# `mdr`: nixpkgs already has an unrelated `mdr` (MichaelMure/mdr, a Go
# terminal renderer) -- same name, different upstream, different language.
# `mdr-rs` is only the nix attribute; the built binary is still `mdr` (that's
# the Cargo package name upstream uses). Same pattern as pint/glowm/gomu:
# release tags carry a `v` (fetch.github fetches rev $ver verbatim, so keep
# it; packages/mdr-rs strips it for the version).
[mdr-rs]
src.github = "CleverCloud/mdr"
fetch.github = "CleverCloud/mdr"

[tmux-open-nvim]
src.git = "https://github.com/trevarj/tmux-open-nvim"
src.branch = "master"
fetch.github = "trevarj/tmux-open-nvim"

[tmux-mouse-swipe]
src.git = "https://github.com/jaclu/tmux-mouse-swipe"
src.branch = "main"
fetch.github = "jaclu/tmux-mouse-swipe"

[tmux-nerd-font-window-name]
src.git = "https://github.com/joshmedeski/tmux-nerd-font-window-name"
src.branch = "main"
fetch.github = "joshmedeski/tmux-nerd-font-window-name"

[bat-gherkin-syntax]
src.git = "https://github.com/keith-hall/SublimeGherkinSyntax"
src.branch = "master"
fetch.github = "keith-hall/SublimeGherkinSyntax"

# Yazi plugins: tracked here so the nightly updater bumps them (previously
# hand-pinned fetchFromGitHub in packages/yaziPlugins/*, which the updater
# never touched — pg2-ztb6l).
[bunny]
src.git = "https://github.com/stelcodes/bunny.yazi"
src.branch = "main"
fetch.github = "stelcodes/bunny.yazi"

[icons-brew]
src.git = "https://github.com/lpnh/icons-brew.yazi"
src.branch = "main"
fetch.github = "lpnh/icons-brew.yazi"
